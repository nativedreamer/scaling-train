<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </radialGradient>
    <linearGradient id="neonCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <linearGradient id="goldAmber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#ef4444" />
    </linearGradient>
  </defs>
  
  <!-- Outer Rounded Container with Safe Margin -->
  <rect width="512" height="512" rx="104" fill="url(#bgGrad)" />
  <rect x="16" y="16" width="480" height="480" rx="90" fill="none" stroke="#1e293b" stroke-width="3" />

  <!-- Radar & Target Rings -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="#1e293b" stroke-width="2" stroke-dasharray="4 8" />
  <circle cx="256" cy="256" r="130" fill="none" stroke="#0e7490" stroke-width="2" opacity="0.4" />
  <circle cx="256" cy="256" r="80" fill="none" stroke="#06b6d4" stroke-width="1.5" opacity="0.6" />
  
  <!-- Crosshairs -->
  <line x1="60" y1="256" x2="452" y2="256" stroke="#1e293b" stroke-width="2" />
  <line x1="256" y1="60" x2="256" y2="452" stroke="#1e293b" stroke-width="2" />

  <!-- Geopolitical Globe Lat/Long Wireframe -->
  <ellipse cx="256" cy="256" rx="140" ry="60" fill="none" stroke="#06b6d4" stroke-width="2" opacity="0.5" />
  <ellipse cx="256" cy="256" rx="60" ry="140" fill="none" stroke="#06b6d4" stroke-width="2" opacity="0.5" />

  <!-- Dynamic Signal Vector / Upward Breakout Candlestick Path -->
  <path d="M 140 330 L 210 280 L 260 300 L 320 200 L 370 170" fill="none" stroke="url(#neonCyan)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />
  
  <!-- Shockwave Ripple -->
  <circle cx="370" cy="170" r="16" fill="none" stroke="#38bdf8" stroke-width="3" opacity="0.8" />
  <circle cx="370" cy="170" r="8" fill="#38bdf8" />
  
  <!-- Critical Chokepoint Hotspot Marker -->
  <circle cx="210" cy="280" r="10" fill="url(#goldAmber)" />
  <circle cx="210" cy="280" r="18" fill="none" stroke="#ef4444" stroke-width="2" opacity="0.7" />

  <!-- WorldMonitor Brand Monogram W M -->
  <text x="256" y="420" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="900" fill="#94a3b8" text-anchor="middle" letter-spacing="6">WM · SIGNAL</text>
</svg>
